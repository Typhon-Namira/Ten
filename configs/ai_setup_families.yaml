version: "setup_families_v1"
families:
  - setup_family_id: "trend_continuation"
    version: "1.0"
    applicable_regimes: ["trending", "volatile_trend"]
    unsuitable_regimes: ["range"]
    mandatory_evidence: ["market_data", "market_regime"]
    supporting_evidence: ["smc", "institutional_flow", "volume_profile"]
    contradictory_evidence: ["regime_reversal"]
    optional_evidence: ["fvg", "order_block", "liquidity"]
    entry_model: "continuation_retest"
    invalidation_model: "trend_structure_break"
    stop_loss_model: "beyond_protected_structure"
    target_model: "next_liquidity_or_profile_node"
    expected_horizon: "3_m5"
    expiry_policy: "expire_after_expected_horizon"
    monitoring_policy: "monitor_structure_regime_and_liquidity"
    minimum_evidence_completeness: 0.55
    permitted_signal_actions: ["BUY", "SELL", "WAIT", "HOLD_EXISTING_SIGNAL", "CANCEL_SETUP", "INVALIDATE_SIGNAL"]
