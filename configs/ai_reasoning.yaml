version: "1.0"
request_schema_version: "1.0"
reasoning_policy_version: "ai_reasoning_policy_v1"
setup_family_registry_version: "setup_families_v1"
prompt_version_new_market: "new_market_analysis_v1"
prompt_version_existing_signal: "existing_signal_monitoring_v1"
maximum_memory_entries: 20
maximum_retries: 1
temperature: 0.1
max_tokens: 1000
# Each provider client is configured five seconds below this orchestration deadline.
request_timeout_seconds: 60.0
llm_concurrency_limit: 1
provider_backoff_initial_seconds: 5.0
provider_backoff_max_seconds: 300.0
target_input_tokens: 4000
warning_input_tokens: 8000
hard_input_tokens: 16000
absolute_max_output_tokens: 2000
maximum_request_cost_usd: 0.05
input_cost_per_million_usd: 1.04
output_cost_per_million_usd: 2.25
