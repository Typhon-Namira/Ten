version: "1.0"
request_schema_version: "1.0"
reasoning_policy_version: "ai_reasoning_policy_v1"
setup_family_registry_version: "setup_families_v1"
prompt_version_new_market: "new_market_analysis_v1"
prompt_version_existing_signal: "existing_signal_monitoring_v1"
maximum_memory_entries: 20
maximum_retries: 1
temperature: 0.1
max_tokens: 3200
# Must stay comfortably above HttpOpenRouterClient's own httpx timeout (30s) so a slow-but-live
# response is reported by httpx's typed timeout (caught as OpenRouterRequestError) instead of
# racing asyncio.wait_for's untyped TimeoutError, which used to get mislabeled "llm_unavailable".
request_timeout_seconds: 45.0
llm_concurrency_limit: 1
provider_backoff_initial_seconds: 5.0
provider_backoff_max_seconds: 300.0
