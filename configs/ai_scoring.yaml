enabled: true
engine_version: "1.0.0"
schema_version: "1.0"
policy_name: weighted_intelligence_v1
policy_version: "1.0.0"
configuration_version: ai-scoring-1.0
future_clock_skew_seconds: 5
output_precision: 4
persistence_required_in_production: true
publish_replay_events: false

components:
  market_data: {directional_weight: 0.0, confidence_weight: 0.10, risk_weight: 0.10, source_group: data, fresh_seconds: 60, stale_seconds: 300}
  market_regime: {directional_weight: 0.20, confidence_weight: 0.15, risk_weight: 0.15, source_group: context, fresh_seconds: 300, stale_seconds: 1800}
  smc: {directional_weight: 0.25, confidence_weight: 0.20, risk_weight: 0.05, source_group: structure, fresh_seconds: 300, stale_seconds: 1800}
  liquidity: {directional_weight: 0.15, confidence_weight: 0.15, risk_weight: 0.15, source_group: structure, fresh_seconds: 300, stale_seconds: 1800}
  volume_profile: {directional_weight: 0.15, confidence_weight: 0.15, risk_weight: 0.10, source_group: participation, fresh_seconds: 300, stale_seconds: 1800}
  institutional_flow: {directional_weight: 0.25, confidence_weight: 0.20, risk_weight: 0.10, source_group: participation, fresh_seconds: 300, stale_seconds: 1800}
  economic_calendar: {directional_weight: 0.0, confidence_weight: 0.05, risk_weight: 0.35, source_group: event_risk, fresh_seconds: 300, stale_seconds: 1800}

evidence:
  minimum_components: 2
  minimum_independent_groups: 2
  single_source_confidence_ceiling: 35.0
  degraded_confidence_ceiling: 65.0
  stale_confidence_ceiling: 45.0
  maximum_missing_directional_weight: 0.60

conflicts:
  directional_gap_threshold: 1.20
  severe_gap_threshold: 1.60
  moderate_penalty: 8.0
  severe_penalty: 15.0
  maximum_total_penalty: 35.0

labels:
  strong_bearish: -70.0
  bearish: -35.0
  slightly_bearish: -10.0
  slightly_bullish: 10.0
  bullish: 35.0
  strong_bullish: 70.0

api: {maximum_page_size: 200, maximum_history_days: 365}
retention: {live_days: 180, replay_days: 30, cleanup_batch_size: 500}
