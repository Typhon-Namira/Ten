services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ten
      POSTGRES_USER: ten
      POSTGRES_PASSWORD: ten
    volumes:
      - ten_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ten -d ten"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    environment:
      TEN_DATABASE_URL: postgresql+asyncpg://ten:ten@postgres:5432/ten
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  ten_postgres:

